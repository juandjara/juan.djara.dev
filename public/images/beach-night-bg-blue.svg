<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:oklch(29.3% 0.066 243.157);stop-opacity:1" />
      <stop offset="100%" style="stop-color:oklch(39.3% 0.066 243.157);stop-opacity:1" />
    </linearGradient>
    <linearGradient id="oceanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:oklch(32% 0.066 243.157);stop-opacity:1" />
      <stop offset="100%" style="stop-color:oklch(36% 0.066 243.157);stop-opacity:1" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:oklch(70% 0.066 243.157);stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:oklch(60% 0.066 243.157);stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:oklch(50% 0.066 243.157);stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#skyGradient)"/>

  <g transform="translate(1760, 120)">
    <!-- Moon - focal point on left side
    <circle cx="0" cy="0" r="80" fill="url(#moonGlow)"/>
    <circle cx="0" cy="0" r="60" fill="oklch(80% 0.066 243.157)"/>
    -->
    <!-- Moon craters for detail
    <circle cx="25" cy="-25" r="15" fill="oklch(75% 0.066 243.157)" opacity="0.6"/>
    <circle cx="-30" cy="30" r="12" fill="oklch(75% 0.066 243.157)" opacity="0.5"/>
    <circle cx="-10" cy="5" r="8" fill="oklch(75% 0.066 243.157)" opacity="0.4"/>
    -->
  </g>

  <!-- Moon reflection in water -->
  <!--<ellipse cx="400" cy="700" rx="60" ry="150" fill="oklch(80% 0.066 243.157)" opacity="0.15"/>
  <ellipse cx="400" cy="700" rx="40" ry="130" fill="oklch(80% 0.066 243.157)" opacity="0.1"/>-->

  <!-- Ocean with reflection -->
  <path d="M 0 550 Q 480 530 960 550 T 1920 550 L 1920 850 L 0 850 Z" fill="url(#oceanGradient)"/>
  <path d="M 0 570 Q 480 560 960 570 T 1920 570 L 1920 850 L 0 850 Z" fill="oklch(29.3% 0.066 243.157)" opacity="0.3"/>

  <!-- Minimal wave lines -->
  <path d="M 0 550 Q 240 540 480 550 T 960 550 T 1440 550 T 1920 550"
        stroke="oklch(60% 0.066 243.157)" stroke-width="1" fill="none" opacity="0.2"/>
  <path d="M 0 580 Q 300 570 600 580 T 1200 580 T 1920 580"
        stroke="oklch(60% 0.066 243.157)" stroke-width="0.5" fill="none" opacity="0.15"/>

  <!-- Beach/Sand - darker -->
  <!--<ellipse cx="960" cy="950" rx="1300" ry="280" fill="oklch(20% 0.066 243.157)"/>-->
  <ellipse cx="960" cy="960" rx="1250" ry="250" fill="oklch(29.3% 0.066 243.157)" opacity="0.9"/>

  <!-- Lone palm tree silhouette on right for balance -->
  <g transform="translate(300, 750)" opacity="0.8">
    <!-- Trunk -->
    <path d="M 0 0 Q -5 80 0 200" stroke="oklch(15% 0.066 243.157)" stroke-width="8" fill="none"/>
    <!-- Palm fronds -->
    <path d="M 0 0 Q -80 -40 -120 -60" stroke="oklch(15% 0.066 243.157)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 0 0 Q -60 -70 -80 -110" stroke="oklch(15% 0.066 243.157)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 0 0 Q 0 -80 0 -120" stroke="oklch(15% 0.066 243.157)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 0 0 Q 60 -70 80 -110" stroke="oklch(15% 0.066 243.157)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 0 0 Q 80 -40 120 -60" stroke="oklch(15% 0.066 243.157)" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Distant sailboat (optional detail) -->
  <g opacity="0.5">
    <polygon points="1200,500 1200,570 1190,570" fill="oklch(60% 0.066 243.157)"/>
    <line x1="1190" y1="570" x2="1210" y2="570" stroke="oklch(35% 0.066 243.157)" stroke-width="2"/>
  </g>

  <!-- Stars scattered across sky -->
  <circle cx="800" cy="150" r="2" fill="var(--color-primary-dark)" opacity="0.8"/>
  <circle cx="1200" cy="200" r="1.5" fill="var(--color-primary-dark)" opacity="0.7"/>
  <circle cx="1500" cy="120" r="2" fill="var(--color-primary-dark)" opacity="0.9"/>
  <circle cx="200" cy="100" r="1" fill="var(--color-primary-dark)" opacity="0.6"/>
  <circle cx="1700" cy="300" r="1.5" fill="var(--color-primary-dark)" opacity="0.8"/>
  <circle cx="600" cy="180" r="1" fill="var(--color-primary-dark)" opacity="0.7"/>
  <circle cx="1400" cy="250" r="2" fill="var(--color-primary-dark)" opacity="0.85"/>
</svg>
